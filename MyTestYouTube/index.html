<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My YouTube Feed</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f0f0f0; }
        h1 { color: #cc0000; }
        .video-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
        iframe { width: 360px; height: 200px; border: 2px solid #ccc; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body>
    <h1>📺 My YouTube Channel</h1>
    <div id="videos" class="video-container"></div>

    <script>
        // 🔑 Replace with your actual API key and channel ID
        const API_KEY = " AIzaSyCVuvE8PpDobxzOV5keL-M_E1UdMFjN-zA"; 
        const CHANNEL_ID = "UCxA7AzkI2Sndf8S1G5rSkwQ";  
        const MAX_RESULTS = 6;

        async function loadVideos() {
            try {
                const url = `https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&channelId=${CHANNEL_ID}&part=snippet,id&order=date&maxResults=${MAX_RESULTS}`;
                const response = await fetch(url);
                
                // Check if the response is successful
                if (!response.ok) {
                    throw new Error(`API call failed with status: ${response.status}`);
                }

                const data = await response.json();

                let videoContainer = document.getElementById("videos");
                
                // Use .filter() and .map() for a more efficient approach
                const videoIframes = data.items
                    .filter(item => item.id.kind === "youtube#video")
                    .map(item => {
                        const videoId = item.id.videoId;
                        // Corrected iframe source URL
                        return `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
                    });

                // Update the DOM in a single operation
                videoContainer.innerHTML = videoIframes.join('');

            } catch (error) {
                console.error("Failed to load videos:", error);
                document.getElementById("videos").innerHTML = "<p>Failed to load videos. Please check your API key and channel ID.</p>";
            }
        }

        // 🚀 Initial call to load videos when the page loads
        loadVideos();

        // 🔄 Set an interval to refresh the video feed every 24 hours
        // 24 hours * 60 minutes * 60 seconds * 1000 milliseconds
        const intervalTime = 24 * 60 * 60 * 1000;
        setInterval(loadVideos, intervalTime);
    </script>
</body>
</html>
