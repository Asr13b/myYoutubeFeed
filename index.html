<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Portfolio | Asrar Fedlu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 10px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-dim);
            font-size: 1.1rem;
        }

        /* Video Grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease-out;
        }

        .video-grid.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        /* Video Card */
        .video-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .video-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            border-color: rgba(56, 189, 248, 0.4);
        }

        .iframe-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
        }

        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Loading Skeleton */
        #loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            header h1 { font-size: 1.8rem; }
            .video-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Technical Video Feed</h1>
            <p>Live streams and project demos from my development channel</p>
        </header>

        <div id="loader">
            <div class="spinner"></div>
        </div>

        <div id="videos" class="video-grid"></div>
    </div>

    <script>
        const API_KEY = "AIzaSyCVuvE8PpDobxzOV5keL-M_E1UdMFjN-zA"; 
        const CHANNEL_ID = "UCxA7AzkI2Sndf8S1G5rSkwQ"; 
        const MAX_RESULTS = 6;

        async function fetchYouTubeFeed() {
            const videoContainer = document.getElementById("videos");
            const loader = document.getElementById("loader");

            try {
                const response = await fetch(`https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&channelId=${CHANNEL_ID}&part=snippet,id&order=date&maxResults=${MAX_RESULTS}`);
                
                if (!response.ok) throw new Error('Network response was not ok');

                const data = await response.json();
                
                const htmlContent = data.items
                    .filter(item => item.id.kind === "youtube#video")
                    .map(item => `
                        <div class="video-card">
                            <div class="iframe-container">
                                <iframe 
                                    src="https://www.youtube.com/embed/${item.id.videoId}" 
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                    allowfullscreen>
                                </iframe>
                            </div>
                        </div>
                    `).join('');

                // Hide loader and show content with animation
                loader.style.display = "none";
                videoContainer.innerHTML = htmlContent;
                setTimeout(() => videoContainer.classList.add('loaded'), 50);

            } catch (error) {
                console.error("Fetch Error:", error);
                loader.innerHTML = `<p style="color: #ef4444;">Failed to sync with YouTube API. Please check configuration.</p>`;
            }
        }

        document.addEventListener('DOMContentLoaded', fetchYouTubeFeed);
    </script>
</body>
</html>
